<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Translation</title>
<!--
  translation.html

  The second window opened by the stage's "Full Screen" button (see
  api.py's open_translation_window). It occupies the BOTTOM THIRD of
  the display at full width and shows nothing but the live captions,
  so whatever is being presented in the upper two thirds — slides, a
  document, a video call — stays visible while the translation runs
  underneath it. The main MithraVoice window is minimized out of the
  way at the same time.

  The window's size and position are decided in Python from the
  actual display resolution (api.py's _bottom_strip_geometry); this
  file only has to lay out well inside whatever strip it is given,
  which on a 1080p screen is roughly 1920x340 and on a 768p laptop
  roughly 1366x230. Nothing below assumes a specific height.

  Python pushes updates here with the exact same
  window.updateSubtitle(original, translated, isFinal) call it makes
  into index.html, so both windows stay in sync from one code path
  (see api.py's _push_result).

  Caption styling is NOT duplicated here as its own set of controls —
  it arrives as query-string params mirroring whatever Caption Style /
  Display / Translation Style is currently set on the main stage, and
  is applied on load by applyStyleFromParams() below.
-->
<style>
  /* TRANSPARENCY, and why the rules below are allowed to use rgba().

     This window is composited by DWM with a real per-pixel alpha
     channel: api.py calls DwmExtendFrameIntoClientArea with "sheet of
     glass" margins, the host form paints pure black (which carries no
     alpha and is composited away), and WebView2 renders on top of that
     with DefaultBackgroundColor = Transparent. The upshot is that
     whatever alpha is written here survives all the way to the screen,
     so a panel at 62% opacity is genuinely 62% opaque over the user's
     slides.

     This replaced a chroma-key scheme where transparency was BINARY —
     a pixel either matched an agreed key colour exactly and vanished
     or was fully opaque — which is why the Light theme used to render
     as a solid white slab and Custom as a solid black one instead of
     showing through. See TRANSLATION_TRANSPARENCY_MODE in api.py.

     html/body still paint nothing at all: the caption panel is the
     only visible surface, and everything around it is meant to be the
     desktop. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    color: #ffffff;
  }

  /* Layout shell only — it paints nothing. It positions the caption
     panel vertically according to the Position setting; the panel
     itself is what is visible. */
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    padding: 12px 18px;
    background: transparent;
  }
  .screen.pos-top    { justify-content: flex-start; }
  .screen.pos-center { justify-content: center; }
  .screen.pos-bottom { justify-content: flex-end; }

  /* The panel hugs its text rather than filling the strip, so it reads
     as a caption card sitting over the desktop instead of a bar ruled
     across the bottom of the screen. Centred horizontally with a
     max-width so a long sentence wraps into a tidy block rather than
     running the full width of a projector.

     Right padding is the largest so the text clears the close button
     in the corner when the panel happens to be full width. */
  .box {
    align-self: center;
    max-width: min(94%, 1500px);
    box-sizing: border-box;
    text-align: center;
    padding: clamp(12px, 2.5%, 26px) clamp(52px, 5%, 70px) clamp(12px, 2.5%, 26px) clamp(24px, 4%, 48px);
    border-radius: 14px;
    background: none;
    border: none;
  }

  .original,
  .translated {
    max-width: 100%;
  }

  .original { line-height: 1.45; }

  /* No `direction` here on purpose. This was hardcoded to rtl, which
     was only correct for the English -> Persian default; with the
     direction reversed the English translation rendered right-aligned
     with its punctuation on the wrong end. Both caption lines carry
     dir="auto" in the markup instead, so each is laid out by the
     script it actually contains. Mirrors index.html. */
  .translated {
    line-height: 1.7;
    margin-top: 10px;
  }

  /* --- Background themes ---------------------------------------------
     All three are see-through now; they differ in how much they darken
     what is behind the text, not in whether they cover it.

     dark   — a translucent dark card. The default: readable over a
              white slide and over a photo, without hiding either.
     light  — no panel at all, just the text floating on the desktop.
              (It is "light" in the sense of adding nothing, and is the
              option to pick when the caption must obscure as little of
              the presentation as possible.)
     custom — the same idea as dark but warmer, with the app's gold
              edge, for when the strip should read as part of the
              branding rather than disappearing. */
  .box.dark {
    background: rgba(8, 10, 14, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  .box.light {
    background: transparent;
    border: none;
  }
  .box.custom {
    background: rgba(26, 21, 10, 0.66);
    border: 1px solid rgba(232, 183, 58, 0.55);
  }

  /* Legibility treatment depends on whether there is a panel behind
     the text.

     With no panel (light), the text can land on anything from a white
     slide to a busy photograph, so it gets an 8-direction hard outline
     in the opposite colour — the only treatment that stays readable on
     an arbitrary background.

     With a panel (dark/custom), the panel is already doing that job
     and a hard outline would look heavy-handed, so those get an
     ordinary soft shadow for a little separation. */
  .box.light.text-white .original,
  .box.light.text-white .translated {
    text-shadow:
      -2px -2px 0 #000, 0 -2px 0 #000, 2px -2px 0 #000,
      -2px  0   0 #000,               2px  0   0 #000,
      -2px  2px 0 #000, 0  2px 0 #000, 2px  2px 0 #000;
  }
  .box.light.text-black .original,
  .box.light.text-black .translated {
    text-shadow:
      -2px -2px 0 #fff, 0 -2px 0 #fff, 2px -2px 0 #fff,
      -2px  0   0 #fff,               2px  0   0 #fff,
      -2px  2px 0 #fff, 0  2px 0 #fff, 2px  2px 0 #fff;
  }
  .box.dark .original,   .box.dark .translated,
  .box.custom .original, .box.custom .translated {
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
  }

  /* Text color is deliberately independent of the background theme,
     exactly as it is on the main stage (see index.html's
     setCaptionTextColor) — picking a background must not silently
     change the text color too. */
  .box.text-white { color: #ffffff; }
  .box.text-black { color: #111111; }

  /* Interim (not yet finalized) results are dimmed with a solid colour
     rather than opacity, so the dimming reads the same whether or not
     there is a panel behind the text. */
  .box.text-white .interim { color: #c9cfd9; }
  .box.text-black .interim { color: #4d4d4d; }

  /* The placeholder shown before the first result arrives. Dimmed the
     same way an interim result is, so it is visibly not a translation
     of anything yet. */
  .placeholder .original,
  .placeholder .translated { opacity: 0.75; }

  /* The close button and the Esc key are the ONLY ways out of this
     window — api.py creates it frameless, so there is no OS title bar
     and no system close button.

     This used to be unclickable, and not because of anything in this
     file: the window was made transparent with a colour key, which
     also makes every keyed pixel click-through, and hit-testing reads
     the host form's surface rather than the content WebView2 draws on
     top of it. The form painted nothing but the key colour, so the
     whole window passed clicks straight through to the application
     behind it and this button could never receive one. The DWM
     transparency this window now uses adds no such behaviour, so the
     window hit-tests normally. See api.py's
     TRANSLATION_TRANSPARENCY_MODE.

     Sized generously and given a solid background so it is an easy
     target against a busy desktop. */
  .close-btn {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(20, 24, 32, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #d6dae2;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .close-btn:hover {
    background: #3a3320;
    border-color: #e8b73a;
    color: #e8b73a;
  }
  .close-btn:active { transform: scale(0.94); }

  .hint {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #cbd1da;
    z-index: 9;
    background: rgba(18, 22, 31, 0.9);
    padding: 4px 12px;
    border-radius: 999px;
    pointer-events: none;
  }
  .hint.gone { display: none; }
</style>
</head>
<body>
  <div class="screen pos-bottom" id="screen">
    <button class="close-btn" id="closeBtn" type="button"
            title="Close the Translation window and restore MithraVoice">&#10005;</button>
    <div class="hint" id="hint">Press Esc to close</div>
    <!-- The placeholder text matches the main stage's, so opening full
         screen before saying anything looks like the window it came
         from rather than an empty box. It is replaced wholesale by the
         first updateSubtitle() call. -->
    <div class="box dark text-white placeholder" id="box">
      <div class="original" id="orig" dir="auto">This is a real-time translation. You can speak and see the translation instantly.</div>
      <div class="translated" id="trans" dir="auto">این یک ترجمهٔ زنده است. شما می‌توانید صحبت کنید و ترجمه را به‌صورت آنی ببینید.</div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const screenEl = document.getElementById('screen');
  const box = document.getElementById('box');
  const origEl = document.getElementById('orig');
  const transEl = document.getElementById('trans');

  /**
   * applyStyleFromParams()
   * Usage: called once on load, and again on resize. Reads the
   * caption-style params api.py's open_translation_window() put in the
   * query string — position, appearance, textColor, fontSize,
   * fontFamily, displayMode — and applies them so this window opens
   * looking like the main stage rather than resetting to defaults.
   * Every param is optional and falls back to the same default
   * index.html starts with.
   */
  function applyStyleFromParams() {
    const position = params.get('position') || 'bottom';
    screenEl.className = 'screen pos-' +
      (['top', 'center', 'bottom'].includes(position) ? position : 'bottom');

    const appearance = params.get('appearance') || 'dark';
    const textColor = params.get('textColor') || 'white';
    // The placeholder class is preserved across restyles so a resize
    // before the first result doesn't un-dim the placeholder text.
    const isPlaceholder = box.classList.contains('placeholder');
    box.className = 'box ' +
      (['dark', 'light', 'custom'].includes(appearance) ? appearance : 'dark') +
      ' text-' + (textColor === 'black' ? 'black' : 'white') +
      (isPlaceholder ? ' placeholder' : '');

    // Font family arrives as a complete CSS stack rather than a key, so
    // adding a font to the picker in index.html needs no change here.
    // Empty means "whatever the page's default is".
    const fontFamily = params.get('fontFamily');
    if (fontFamily) {
      box.style.fontFamily = fontFamily;
    }

    // Font size has to satisfy TWO constraints, and the smaller wins.
    //
    // By width: the main stage's size is tuned for a ~1280px window,
    // and this strip is usually wider, so scale up proportionally
    // rather than showing 24px text across a 1920px projector.
    //
    // By height: this window is only a third of the screen tall, so
    // an unconstrained width-based size overflows it — on a 1080p
    // display that is ~340px of window for what may be two lines of
    // original plus two of translation, and overflow is hidden, so
    // text would silently vanish rather than just look cramped. The
    // divisor accounts for four text lines plus padding.
    const baseFontSize = Number(params.get('fontSize')) || 24;
    const displayMode = params.get('displayMode') || 'both';
    const linesShown = (displayMode === 'both') ? 4 : 2;

    const byWidth = baseFontSize * (window.innerWidth / 1280) * 1.6;
    const byHeight = (window.innerHeight * 0.82) / (linesShown * 1.55);
    const fontSize = Math.max(13, Math.min(96, Math.round(Math.min(byWidth, byHeight))));

    origEl.style.fontSize = fontSize + 'px';
    transEl.style.fontSize = fontSize + 'px';

    origEl.style.display = (displayMode === 'translation') ? 'none' : 'block';
    transEl.style.display = (displayMode === 'original') ? 'none' : 'block';
    transEl.style.marginTop = (displayMode === 'both') ? '10px' : '0';
  }

  applyStyleFromParams();

  /**
   * reportGeometry()
   * Usage: called once on load. Tells Python what size this window
   * actually ended up being, so api.py's
   * report_translation_geometry() can print whether the bottom-third
   * calculation survived the display's DPI scaling. Purely a
   * diagnostic — nothing here reads the result, and the window
   * renders identically whether or not the bridge is present.
   *
   * Runs on a short delay rather than immediately: pywebview's
   * window.pywebview.api object is injected asynchronously, so a
   * synchronous call at script-evaluation time can land before the
   * bridge exists and be silently lost.
   */
  function reportGeometry() {
    if (window.pywebview &&
        window.pywebview.api &&
        window.pywebview.api.report_translation_geometry) {
      window.pywebview.api.report_translation_geometry(
        window.innerWidth,
        window.innerHeight,
        window.devicePixelRatio || 1
      );
    }
  }
  setTimeout(reportGeometry, 400);

  /**
   * closeWindow()
   * Usage: internal — the single exit path, shared by the X button and
   * the Esc key. Calls api.py's close_translation_window(), which
   * destroys this window; that fires its `closed` event, which is what
   * actually restores the minimized main window (see api.py's
   * _on_translation_closed). Deliberately routed through Python rather
   * than window.close() so the restore happens no matter how this
   * window is dismissed.
   *
   * Guarded so that one user gesture produces exactly ONE destroy.
   * Without the guard, closing threw System.ObjectDisposedException on
   * the Python side every single time: destroying the window is not
   * instantaneous, so a second call arriving milliseconds later found
   * a Form that had already been disposed. The window still closed, but
   * every close left a traceback in the log — the kind of routine noise
   * that hides a real failure when one eventually happens.
   *
   * The flag is released after a moment rather than latched forever, so
   * that if a close genuinely fails (no bridge yet, and window.close()
   * blocked) the user can still try again instead of being stuck in a
   * window with no title bar.
   *
   * The bridge is re-checked on every call rather than captured once,
   * and window.close() is kept as a last resort: pywebview injects
   * window.pywebview.api asynchronously, so an impatient click a
   * fraction of a second after the window appears can arrive before it
   * exists. Without the fallback that click would do nothing at all,
   * on a window whose whole point is that this button is one of only
   * two ways to close it.
   */
  let closeRequested = false;
  function closeWindow() {
    if (closeRequested) return;
    closeRequested = true;
    setTimeout(() => { closeRequested = false; }, 1500);

    const api = window.pywebview && window.pywebview.api;
    if (api && api.close_translation_window) {
      try {
        api.close_translation_window();
        return;
      } catch (err) {
        console.error('close_translation_window failed', err);
      }
    }
    window.close();
  }

  // click only. A pointerup handler was tried here as well, on the
  // theory that a touch display might not synthesize a click — but
  // pointerup fires BEFORE click for an ordinary mouse press, and
  // preventDefault() on it does not suppress the click that follows, so
  // every mouse press ran this twice. Browsers do synthesize click from
  // a tap, so the extra handler bought nothing and cost a double close.
  document.getElementById('closeBtn').addEventListener('click', closeWindow);

  // Bound to the document only. keydown bubbles document -> window, so
  // listening on both fired this twice for a single Esc press.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.keyCode === 27) closeWindow();
  });

  // The Esc hint has done its job after a few seconds; hide it so it
  // isn't sitting on screen for the whole presentation.
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 5000);

  /**
   * window.updateSubtitle(original, translated, isFinal)
   * Usage: called BY PYTHON (via window.evaluate_js) — never from
   * within this file. Identical signature and hook name to
   * index.html's, so api.py's _push_result can send the exact same
   * one-line script to both windows and keep them mirrored without
   * knowing anything about which is which.
   */
  window.updateSubtitle = function (original, translated, isFinal) {
    // The first real result retires the placeholder styling for good.
    box.classList.remove('placeholder');
    origEl.textContent = original || '';
    transEl.textContent = translated || '';
    // classList, not style.opacity — see the .interim CSS rule.
    origEl.classList.toggle('interim', !isFinal);
    transEl.classList.toggle('interim', !isFinal);
  };

  // Recompute the scaled font size if the window is resized (e.g. the
  // user drops out of full screen via the OS), so text stays readable
  // at whatever size the window actually is.
  window.addEventListener('resize', applyStyleFromParams);
</script>
</body>
</html>
